<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nomad Karavan | Kasa Kontrol Paneli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* CANLI ÇAM YEŞİLİ & ATEŞ KİREMİDİ & KEHRİBAR */
      --bg-dark: #0f1c15;              
      --bg-card: rgba(22, 42, 32, 0.82); 
      --card-border: rgba(234, 88, 12, 0.28);
      
      --terracotta: #ea580c;           
      --terracotta-glow: rgba(234, 88, 12, 0.45);
      --terracotta-dark: #c2410c;
      
      --amber: #f59e0b;                
      --amber-soft: rgba(245, 158, 11, 0.15);
      
      --emerald-accent: #1b4d36;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      
      --text-main: #f8fafc;            
      --text-muted: #9bb0a3;
      --shadow-3d: 0 16px 36px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    .ambient-glow-1 {
      position: fixed;
      top: -60px;
      left: -60px;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(234, 88, 12, 0.2) 0%, transparent 70%);
      filter: blur(50px);
      z-index: 0;
      pointer-events: none;
    }

    .ambient-glow-2 {
      position: fixed;
      bottom: -40px;
      right: -60px;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(27, 77, 54, 0.28) 0%, transparent 70%);
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
    }

    /* ÜST KASA HEADER */
    header {
      background: rgba(15, 28, 21, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1.5px solid var(--card-border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 50;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-emblem {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #ea580c 0%, #1b4d36 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--amber);
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.35);
      flex-shrink: 0;
    }

    .brand-logo-emblem svg {
      width: 26px;
      height: 26px;
    }

    .brand-info h1 {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: -0.3px;
      color: #ffffff;
    }

    .brand-info p {
      font-size: 0.72rem;
      color: var(--amber);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-summary {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .badge-pill {
      font-size: 0.82rem;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-empty {
      background: rgba(27, 77, 54, 0.3);
      border: 1.5px solid var(--emerald-accent);
      color: #a7f3d0;
    }

    .badge-busy {
      background: rgba(234, 88, 12, 0.25);
      border: 1.5px solid var(--terracotta);
      color: #fdba74;
      box-shadow: 0 0 14px rgba(234, 88, 12, 0.35);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* ANA ÇALIŞMA ALANI */
    .dashboard-layout {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
      z-index: 10;
    }

    .tables-section {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 0.92rem;
      font-weight: 900;
      color: var(--amber);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .table-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 14px;
    }

    .table-card {
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .table-card:hover {
      transform: translateY(-2px);
    }

    .table-card.empty {
      border: 1.5px solid rgba(27, 77, 54, 0.5);
    }
    .table-card.empty:hover {
      border-color: #22c55e;
      box-shadow: 0 8px 24px rgba(34, 197, 94, 0.25);
    }
    .table-card.empty .table-status-text {
      color: #86efac;
      background: rgba(27, 77, 54, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
    }

    .table-card.busy {
      border: 2px solid var(--terracotta);
      background: rgba(45, 18, 12, 0.75);
      box-shadow: 0 10px 28px var(--terracotta-glow);
      animation: pulseAlert 2.5s infinite;
    }
    .table-card.busy .table-status-text {
      color: #ffffff;
      background: var(--terracotta);
      padding: 4px 10px;
      border-radius: 12px;
    }

    @keyframes pulseAlert {
      0% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0.5); }
      70% { box-shadow: 0 0 0 12px rgba(234, 88, 12, 0); }
      100% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0); }
    }

    .table-number {
      font-size: 1.25rem;
      font-weight: 900;
      color: #ffffff;
    }

    .table-status-text {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .table-amount {
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--amber);
      margin-top: 4px;
    }

    /* SAĞ: CANLI ADİSYON DETAY ÇEKMECESİ */
    .detail-section {
      width: 420px;
      background: rgba(16, 32, 24, 0.96);
      backdrop-filter: blur(18px);
      border-left: 1.5px solid var(--card-border);
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 35px rgba(0, 0, 0, 0.5);
    }

    .detail-header {
      padding: 20px 24px;
      border-bottom: 1.5px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-header h3 {
      font-size: 1.2rem;
      font-weight: 900;
      color: #ffffff;
    }

    .detail-time {
      font-size: 0.75rem;
      color: var(--amber);
      font-weight: 700;
    }

    .detail-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .order-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: var(--bg-card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .item-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .item-name {
      font-size: 0.92rem;
      font-weight: 800;
      color: #ffffff;
    }

    .item-unit-info {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .item-price {
      font-size: 1rem;
      font-weight: 900;
      color: var(--amber);
      min-width: 55px;
      text-align: right;
    }

    .btn-qty-minus {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-qty-minus:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-item-delete {
      background: rgba(234, 88, 12, 0.2);
      color: #fdba74;
      border: 1px solid var(--terracotta);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-item-delete:hover {
      background: var(--terracotta);
      color: #ffffff;
      box-shadow: 0 0 10px var(--terracotta);
    }

    .detail-footer {
      padding: 20px 24px;
      border-top: 1.5px solid var(--card-border);
      background: rgba(15, 28, 21, 0.96);
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .total-title {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .total-sum {
      font-size: 1.65rem;
      font-weight: 900;
      color: var(--amber);
    }

    .btn-close-order {
      width: 100%;
      background: linear-gradient(135deg, var(--terracotta) 0%, var(--terracotta-dark) 100%);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px var(--terracotta-glow);
      transition: opacity 0.2s;
    }

    .btn-close-order:hover {
      opacity: 0.92;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 40px 20px;
    }

    /* GARSON BİLDİRİM UYARISI */
    .garson-toast {
      position: fixed;
      top: 24px;
      right: 24px;
      background: linear-gradient(135deg, var(--terracotta) 0%, #d97706 100%);
      color: #ffffff;
      padding: 16px 22px;
      border-radius: 18px;
      font-size: 0.92rem;
      font-weight: 800;
      box-shadow: 0 10px 30px var(--terracotta-glow);
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 200;
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: slideRight 0.3s ease;
    }

    @keyframes slideRight {
      from { transform: translateX(50px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @media (max-width: 900px) {
      .dashboard-layout {
        flex-direction: column;
      }
      .detail-section {
        width: 100%;
        border-left: none;
        border-top: 1.5px solid var(--card-border);
        max-height: 48vh;
      }
    }
  </style>
</head>
<body>

  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <!-- GARSON BİLDİRİM UYARISI -->
  <div class="garson-toast" id="garson-alert">
    <span style="font-size:1.3rem;">🔔</span>
    <span id="garson-alert-text">Masa 12 garson çağırıyor!</span>
  </div>

  <!-- ÜST HEADER -->
  <header>
    <div class="brand-wrap">
      <div class="brand-logo-emblem">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M5 23h20c1.5 0 2.5-1 2.5-2.5V13c0-2.5-2-4.5-4.5-4.5H9C6.5 8.5 5 10.5 5 13v7.5c0 1.5 1 2.5 0 2.5z" fill="#ea580c"/>
          <path d="M9 8.5h14c1.5 0 2.5 1 2.5 2v1.5H6.5V10.5c0-1 1-2 2.5-2z" fill="#f59e0b"/>
          <rect x="8" y="13" width="6" height="5" rx="1.5" fill="#ffffff"/>
          <rect x="17" y="13" width="6" height="5" rx="1.5" fill="#ffffff"/>
          <circle cx="12" cy="23" r="3" fill="#0b1712" stroke="#f59e0b" stroke-width="1.5"/>
          <circle cx="22" cy="23" r="3" fill="#0b1712" stroke="#f59e0b" stroke-width="1.5"/>
          <path d="M16 4.5c.8.8-.8 1.4 0 2.2" stroke="#f59e0b" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-info">
        <h1>NOMAD KARAVAN • KASA KONTROL</h1>
        <p>Tatvan Canlı Masa & Adisyon</p>
      </div>
    </div>
    <div class="status-summary">
      <div class="badge-pill badge-busy">
        <span class="dot" style="background:var(--terracotta);"></span>
        <span id="stat-busy">0 Dolu</span>
      </div>
      <div class="badge-pill badge-empty">
        <span class="dot" style="background:var(--emerald-accent);"></span>
        <span id="stat-empty">20 Boş</span>
      </div>
    </div>
  </header>

  <!-- ANA DASHBOARD -->
  <div class="dashboard-layout">
    <div class="tables-section">
      <div class="section-title">Masalar (Masa 1 - 20)</div>
      <div class="table-grid" id="tables-container"></div>
    </div>

    <!-- SAĞ: ADİSYON DETAYI -->
    <div class="detail-section">
      <div class="detail-header">
        <div>
          <h3 id="panel-table-title">Masa Seçiniz</h3>
          <span class="detail-time" id="panel-order-time">-</span>
        </div>
      </div>

      <div class="detail-content" id="panel-orders-list">
        <div class="empty-state">Detayları görmek için listeden bir masaya dokunun.</div>
      </div>

      <div class="detail-footer" id="panel-footer" style="display:none;">
        <div class="total-box">
          <span class="total-title">Genel Toplam:</span>
          <span class="total-sum" id="panel-total-price">0 ₺</span>
        </div>
        <button class="btn-close-order" onclick="masayiBosalt()">
          ✕ Hesabı Kapat / Masayı Boşalt
        </button>
      </div>
    </div>
  </div>

  <script>
    const TOPLAM_MASA = 20;
    let seciliMasa = null;
    let sonVeriOzeti = "";

    // =========================================
    // İKİ AYRI SES MOTORU (WEB AUDIO API)
    // =========================================
    
    // 1. SİPARİŞ GELDİĞİNDE ÇALAN TOK VE MELODİK KASA ZİLİ (CHIME)
    function calSiparisSesi() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 1. Ton (Do5)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = "sine";
        osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        gain1.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start();
        osc1.stop(audioCtx.currentTime + 0.35);

        // 2. Ton (Mi5)
        setTimeout(() => {
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.type = "sine";
          osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime);
          gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          osc2.start();
          osc2.stop(audioCtx.currentTime + 0.5);
        }, 120);

      } catch(e) {
        console.log("Ses çalma izni bekleniyor");
      }
    }

    // 2. GARSON ÇAĞRILDIĞINDA ÇALAN TİZ VE DİKKAT ÇEKİCİ ZİL (BELL GONG)
    function calGarsonSesi() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // İki seri vuruş (Çın çın!)
        [0, 160].forEach((delay) => {
          setTimeout(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(1480, audioCtx.currentTime); // Tiz F#6
            gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.28);
          }, delay);
        });

      } catch(e) {
        console.log("Ses çalma izni bekleniyor");
      }
    }

    // MASALARI GETİR / KAYDET
    function getAdisyonlar() {
      return JSON.parse(localStorage.getItem('nomad_masalar') || '{}');
    }

    function setAdisyonlar(data) {
      localStorage.setItem('nomad_masalar', JSON.stringify(data));
      sonVeriOzeti = JSON.stringify(data);
    }

    // MASALARI EKRANA ÇİZME
    function masalariGuncelle() {
      const container = document.getElementById('tables-container');
      const adisyonlar = getAdisyonlar();
      let doluSayisi = 0;

      container.innerHTML = "";

      for (let i = 1; i <= TOPLAM_MASA; i++) {
        const masaKey = String(i);
        const data = adisyonlar[masaKey];
        const isBusy = data && data.urunler && data.urunler.length > 0;

        if (isBusy) doluSayisi++;

        const card = document.createElement('div');
        card.className = `table-card ${isBusy ? 'busy' : 'empty'}`;
        card.onclick = () => masaDetayiGoster(i);

        card.innerHTML = `
          <div class="table-number">Masa ${i}</div>
          <div class="table-status-text">${isBusy ? 'DOLU' : 'BOŞ'}</div>
          ${isBusy ? `<div class="table-amount">${data.toplamTutar} ₺</div>` : ''}
        `;
        container.appendChild(card);
      }

      document.getElementById('stat-busy').innerText = `${doluSayisi} Dolu`;
      document.getElementById('stat-empty').innerText = `${TOPLAM_MASA - doluSayisi} Boş`;

      if (seciliMasa) {
        masaDetayiGoster(seciliMasa, false);
      }
    }

    function masaDetayiGoster(masaNo, secimDegisti = true) {
      seciliMasa = masaNo;
      const adisyonlar = getAdisyonlar();
      const data = adisyonlar[String(masaNo)];

      document.getElementById('panel-table-title').innerText = `Masa ${masaNo} Adisyonu`;
      const listEl = document.getElementById('panel-orders-list');
      const footerEl = document.getElementById('panel-footer');

      if (!data || !data.urunler || data.urunler.length === 0) {
        document.getElementById('panel-order-time').innerText = "Henüz sipariş yok";
        listEl.innerHTML = `<div class="empty-state">Bu masa şu anda boş.</div>`;
        footerEl.style.display = "none";
        return;
      }

      document.getElementById('panel-order-time').innerText = `Son Sipariş: ${data.saat || '-'}`;
      footerEl.style.display = "block";
      document.getElementById('panel-total-price').innerText = `${data.toplamTutar} ₺`;

      listEl.innerHTML = "";
      data.urunler.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = "order-item-row";
        row.innerHTML = `
          <div class="item-left">
            <span class="item-name">${item.ad}</span>
            <span class="item-unit-info">${item.adet} adet × ${item.birimFiyat} ₺</span>
          </div>
          <div class="item-actions">
            <span class="item-price">${item.tutar} ₺</span>
            <button class="btn-qty-minus" title="Adet Azalt" onclick="adetAzalt(${masaNo}, ${index})">−</button>
            <button class="btn-item-delete" title="Tamamen Kaldır" onclick="urunuSil(${masaNo}, ${index})">✕</button>
          </div>
        `;
        listEl.appendChild(row);
      });
    }

    function adetAzalt(masaNo, index) {
      const adisyonlar = getAdisyonlar();
      const data = adisyonlar[String(masaNo)];
      if (!data || !data.urunler[index]) return;

      const urun = data.urunler[index];
      if (urun.adet > 1) {
        urun.adet -= 1;
        urun.tutar = urun.adet * urun.birimFiyat;
      } else {
        data.urunler.splice(index, 1);
      }

      data.toplamTutar = data.urunler.reduce((acc, curr) => acc + curr.tutar, 0);

      if (data.urunler.length === 0) {
        delete adisyonlar[String(masaNo)];
      }

      setAdisyonlar(adisyonlar);
      masalariGuncelle();
    }

    function urunuSil(masaNo, index) {
      const adisyonlar = getAdisyonlar();
      const data = adisyonlar[String(masaNo)];
      if (!data || !data.urunler[index]) return;

      const silinenAd = data.urunler[index].ad;
      if (confirm(`"${silinenAd}" adisyondan çıkarılsın mı?`)) {
        data.urunler.splice(index, 1);
        data.toplamTutar = data.urunler.reduce((acc, curr) => acc + curr.tutar, 0);

        if (data.urunler.length === 0) {
          delete adisyonlar[String(masaNo)];
        }

        setAdisyonlar(adisyonlar);
        masalariGuncelle();
      }
    }

    function masayiBosalt() {
      if (!seciliMasa) return;
      if (confirm(`Masa ${seciliMasa} hesabını kapatıp masayı boşaltmak istediğinize emin misiniz?`)) {
        const adisyonlar = getAdisyonlar();
        delete adisyonlar[String(seciliMasa)];
        setAdisyonlar(adisyonlar);
        masalariGuncelle();
        masaDetayiGoster(seciliMasa);
      }
    }

    function garsonUyarisiGoster(masaNo) {
      calGarsonSesi(); // TİZ GARSON SESİ
      const el = document.getElementById('garson-alert');
      document.getElementById('garson-alert-text').innerText = `Masa ${masaNo} garson çağırıyor! 🔔`;
      el.style.display = 'flex';
      setTimeout(() => {
        el.style.display = 'none';
      }, 5000);
    }

    // AYRI SİNYAL AYRIŞTIRICI (BROADCASTCHANNEL)
    const kanal = new BroadcastChannel('pos_siparis_hatti');
    kanal.onmessage = (event) => {
      const gelen = event.data;
      if (gelen.tur === 'garson_cagrisi') {
        garsonUyarisiGoster(gelen.masaNo);
      } else {
        calSiparisSesi(); // MELODİK SİPARİŞ SESİ
        masalariGuncelle();
      }
    };

    window.addEventListener('storage', (e) => {
      if (e.key === 'nomad_masalar') {
        calSiparisSesi();
        masalariGuncelle();
      }
    });

    setInterval(() => {
      const guncelVeri = localStorage.getItem('nomad_masalar') || '';
      if (guncelVeri !== sonVeriOzeti) {
        sonVeriOzeti = guncelVeri;
        masalariGuncelle();
      }
    }, 1000);

    sonVeriOzeti = localStorage.getItem('nomad_masalar') || '';
    masalariGuncelle();
  </script>
</body>
</html>
