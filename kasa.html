<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nomad Karavan | Kasa Kontrol Paneli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f1c15;              
      --bg-card: rgba(22, 42, 32, 0.82); 
      --card-border: rgba(234, 88, 12, 0.28);
      --terracotta: #ea580c;           
      --terracotta-glow: rgba(234, 88, 12, 0.45);
      --terracotta-dark: #c2410c;
      --amber: #f59e0b;                
      --emerald-accent: #1b4d36;
      --text-main: #f8fafc;            
      --text-muted: #9bb0a3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    .ambient-glow-1 {
      position: fixed;
      top: -60px;
      left: -60px;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(234, 88, 12, 0.2) 0%, transparent 70%);
      filter: blur(50px);
      z-index: 0;
      pointer-events: none;
    }

    .ambient-glow-2 {
      position: fixed;
      bottom: -40px;
      right: -60px;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(27, 77, 54, 0.28) 0%, transparent 70%);
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
    }

    header {
      background: rgba(15, 28, 21, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1.5px solid var(--card-border);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 50;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-emblem {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #ea580c 0%, #1b4d36 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--amber);
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.35);
      flex-shrink: 0;
    }

    .brand-logo-emblem svg {
      width: 24px;
      height: 24px;
    }

    .brand-info h1 {
      font-size: 1rem;
      font-weight: 900;
      color: #ffffff;
    }

    .brand-info p {
      font-size: 0.72rem;
      color: var(--amber);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-sound-unlock {
      background: var(--amber);
      color: #0f172a;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
      animation: pulseSound 2s infinite;
      transition: all 0.2s;
    }

    .btn-sound-unlock.unlocked {
      background: rgba(16, 185, 129, 0.22);
      color: #6ee7b7;
      border: 1.5px solid #10b981;
      box-shadow: none;
      animation: none;
    }

    @keyframes pulseSound {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    .badge-pill {
      font-size: 0.8rem;
      font-weight: 800;
      padding: 7px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-empty {
      background: rgba(27, 77, 54, 0.3);
      border: 1.5px solid var(--emerald-accent);
      color: #a7f3d0;
    }

    .badge-busy {
      background: rgba(234, 88, 12, 0.25);
      border: 1.5px solid var(--terracotta);
      color: #fdba74;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dashboard-layout {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
      z-index: 10;
    }

    .tables-section {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 900;
      color: var(--amber);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .table-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 12px;
    }

    .table-card {
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: all 0.2s;
      user-select: none;
    }

    .table-card.empty {
      border: 1.5px solid rgba(27, 77, 54, 0.5);
    }
    .table-card.empty .table-status-text {
      color: #86efac;
      background: rgba(27, 77, 54, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
    }

    .table-card.busy {
      border: 2px solid var(--terracotta);
      background: rgba(45, 18, 12, 0.8);
      box-shadow: 0 10px 28px var(--terracotta-glow);
      animation: pulseAlert 2.5s infinite;
    }
    .table-card.busy .table-status-text {
      color: #ffffff;
      background: var(--terracotta);
      padding: 4px 10px;
      border-radius: 12px;
    }

    @keyframes pulseAlert {
      0% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0.5); }
      70% { box-shadow: 0 0 0 12px rgba(234, 88, 12, 0); }
      100% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0); }
    }

    .table-number {
      font-size: 1.2rem;
      font-weight: 900;
      color: #ffffff;
    }

    .table-status-text {
      font-size: 0.7rem;
      font-weight: 800;
    }

    .table-amount {
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--amber);
      margin-top: 2px;
    }

    .detail-section {
      width: 420px;
      background: rgba(16, 32, 24, 0.96);
      backdrop-filter: blur(18px);
      border-left: 1.5px solid var(--card-border);
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 35px rgba(0, 0, 0, 0.5);
    }

    .detail-header {
      padding: 18px 22px;
      border-bottom: 1.5px solid var(--card-border);
    }

    .detail-header h3 {
      font-size: 1.15rem;
      font-weight: 900;
      color: #ffffff;
    }

    .detail-time {
      font-size: 0.75rem;
      color: var(--amber);
      font-weight: 700;
    }

    .detail-content {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .order-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: var(--bg-card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      gap: 10px;
    }

    .item-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .item-name {
      font-size: 0.9rem;
      font-weight: 800;
      color: #ffffff;
    }

    .item-unit-info {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .item-price {
      font-size: 0.98rem;
      font-weight: 900;
      color: var(--amber);
      min-width: 52px;
      text-align: right;
    }

    .btn-qty-minus {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-item-delete {
      background: rgba(234, 88, 12, 0.2);
      color: #fdba74;
      border: 1px solid var(--terracotta);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .detail-footer {
      padding: 18px 22px;
      border-top: 1.5px solid var(--card-border);
      background: rgba(15, 28, 21, 0.96);
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .total-title {
      font-size: 0.92rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .total-sum {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--amber);
    }

    .btn-close-order {
      width: 100%;
      background: linear-gradient(135deg, var(--terracotta) 0%, var(--terracotta-dark) 100%);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px var(--terracotta-glow);
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.86rem;
      font-weight: 600;
      padding: 30px 16px;
    }

    .garson-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, var(--terracotta) 0%, #d97706 100%);
      color: #ffffff;
      padding: 14px 22px;
      border-radius: 18px;
      font-size: 0.95rem;
      font-weight: 900;
      box-shadow: 0 10px 30px var(--terracotta-glow);
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 300;
      border: 1.5px solid #ffffff;
    }

    @media (max-width: 900px) {
      .dashboard-layout {
        flex-direction: column;
      }
      .detail-section {
        width: 100%;
        border-left: none;
        border-top: 1.5px solid var(--card-border);
        min-height: 45vh;
      }
    }
  </style>
</head>
<body>

  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <div class="garson-toast" id="garson-alert">
    <span style="font-size:1.3rem;">🔔</span>
    <span id="garson-alert-text">Masa 12 garson çağırıyor!</span>
  </div>

  <header>
    <div class="brand-wrap">
      <div class="brand-logo-emblem">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M5 23h20c1.5 0 2.5-1 2.5-2.5V13c0-2.5-2-4.5-4.5-4.5H9C6.5 8.5 5 10.5 5 13v7.5c0 1.5 1 2.5 0 2.5z" fill="#ea580c"/>
          <path d="M9 8.5h14c1.5 0 2.5 1 2.5 2v1.5H6.5V10.5c0-1 1-2 2.5-2z" fill="#f59e0b"/>
          <rect x="8" y="13" width="6" height="5" rx="1.5" fill="#ffffff"/>
          <rect x="17" y="13" width="6" height="5" rx="1.5" fill="#ffffff"/>
          <circle cx="12" cy="23" r="3" fill="#0b1712" stroke="#f59e0b" stroke-width="1.5"/>
          <circle cx="22" cy="23" r="3" fill="#0b1712" stroke="#f59e0b" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="brand-info">
        <h1>NOMAD KARAVAN • KASA</h1>
        <p>Tatvan Canlı Yönetim</p>
      </div>
    </div>

    <div class="header-controls">
      <button class="btn-sound-unlock" id="btn-sound" onclick="sesDurumunuDegistir()">
        <span>🔇</span>
        <span>Sesi Aktif Et</span>
      </button>

      <div class="badge-pill badge-busy">
        <span class="dot" style="background:var(--terracotta);"></span>
        <span id="stat-busy">0 Dolu</span>
      </div>
      <div class="badge-pill badge-empty">
        <span class="dot" style="background:var(--emerald-accent);"></span>
        <span id="stat-empty">20 Boş</span>
      </div>
    </div>
  </header>

  <div class="dashboard-layout">
    <div class="tables-section">
      <div class="section-title">Masalar (Masa 1 - 20)</div>
      <div class="table-grid" id="tables-container"></div>
    </div>

    <div class="detail-section">
      <div class="detail-header">
        <div>
          <h3 id="panel-table-title">Masa Seçiniz</h3>
          <span class="detail-time" id="panel-order-time">-</span>
        </div>
      </div>

      <div class="detail-content" id="panel-orders-list">
        <div class="empty-state">Detayları görmek için listeden bir masaya dokunun.</div>
      </div>

      <div class="detail-footer" id="panel-footer" style="display:none;">
        <div class="total-box">
          <span class="total-title">Genel Toplam:</span>
          <span class="total-sum" id="panel-total-price">0 ₺</span>
        </div>
        <button class="btn-close-order" onclick="masayiBosalt()">
          ✕ Hesabı Kapat / Masayı Boşalt
        </button>
      </div>
    </div>
  </div>

  <script>
    const FIREBASE_URL = "https://nomad-karavan-default-rtdb.europe-west1.firebasedatabase.app";

    const TOPLAM_MASA = 20;
    let seciliMasa = null;
    let canliMasalar = {};
    let sonSiparisZamanlari = {};
    let islenenGarsonCagrilari = new Set();
    let audioCtx = null;
    let sesAcik = false;

    function iosSesMotorunuUyandir() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start(0);
    }

    function sesDurumunuDegistir() {
      const btn = document.getElementById('btn-sound');
      if (!sesAcik) {
        sesAcik = true;
        iosSesMotorunuUyandir();
        btn.classList.add('unlocked');
        btn.innerHTML = `<span>🔊</span><span>Ses Aktif (Kapat)</span>`;
        calSiparisSesi();
      } else {
        sesAcik = false;
        btn.classList.remove('unlocked');
        btn.innerHTML = `<span>🔇</span><span>Sesi Aktif Et</span>`;
      }
    }

    function calSiparisSesi() {
      if (!sesAcik) return;
      try {
        iosSesMotorunuUyandir();
        const now = audioCtx.currentTime;

        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = "sine";
        osc1.frequency.setValueAtTime(587.33, now);
        gain1.gain.setValueAtTime(0.6, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.35);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = "sine";
        osc2.frequency.setValueAtTime(880, now + 0.16);
        gain2.gain.setValueAtTime(0.7, now + 0.16);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.16);
        osc2.stop(now + 0.6);
      } catch(e) {}
    }

    function calGarsonSesi() {
      if (!sesAcik) return;
      try {
        iosSesMotorunuUyandir();
        const now = audioCtx.currentTime;

        [0, 0.22].forEach((offset) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(1567.98, now + offset);
          gain.gain.setValueAtTime(0.75, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.2);
        });
      } catch(e) {}
    }

    async function buluttanVeriCek() {
      try {
        const masaRes = await fetch(`${FIREBASE_URL}/masalar.json`);
        const yeniMasalar = (await masaRes.json()) || {};

        let yeniSiparisVar = false;
        for (let mKey in yeniMasalar) {
          const m = yeniMasalar[mKey];
          if (m && m.sonGuncelleme && sonSiparisZamanlari[mKey] !== m.sonGuncelleme) {
            if (sonSiparisZamanlari[mKey] !== undefined) {
              yeniSiparisVar = true;
            }
            sonSiparisZamanlari[mKey] = m.sonGuncelleme;
          }
        }

        canliMasalar = yeniMasalar;
        masalariCiz();

        if (yeniSiparisVar) {
          calSiparisSesi();
        }

        const cagriRes = await fetch(`${FIREBASE_URL}/garson_cagrilari.json`);
        const cagrilar = await cagriRes.json();

        if (cagrilar) {
          for (let cKey in cagrilar) {
            if (!islenenGarsonCagrilari.has(cKey)) {
              islenenGarsonCagrilari.add(cKey);
              const cagri = cagrilar[cKey];
              if (Date.now() - cagri.zamanDamgasi < 30000) {
                garsonUyarisiGoster(cagri.masaNo);
              }
              fetch(`${FIREBASE_URL}/garson_cagrilari/${cKey}.json`, { method: 'DELETE' });
            }
          }
        }
      } catch (err) {}
    }

    function masalariCiz() {
      const container = document.getElementById('tables-container');
      container.innerHTML = "";
      let doluSayisi = 0;

      for (let i = 1; i <= TOPLAM_MASA; i++) {
        const masaKey = String(i);
        const data = canliMasalar[masaKey];
        const isBusy = data && data.urunler && data.urunler.length > 0;

        if (isBusy) doluSayisi++;

        const card = document.createElement('div');
        card.className = `table-card ${isBusy ? 'busy' : 'empty'}`;
        card.onclick = () => masaDetayiGoster(i);

        card.innerHTML = `
          <div class="table-number">Masa ${i}</div>
          <div class="table-status-text">${isBusy ? 'DOLU' : 'BOŞ'}</div>
          ${isBusy ? `<div class="table-amount">${data.toplamTutar} ₺</div>` : ''}
        `;
        container.appendChild(card);
      }

      document.getElementById('stat-busy').innerText = `${doluSayisi} Dolu`;
      document.getElementById('stat-empty').innerText = `${TOPLAM_MASA - doluSayisi} Boş`;

      if (seciliMasa) {
        masaDetayiGoster(seciliMasa);
      }
    }

    function masaDetayiGoster(masaNo) {
      seciliMasa = masaNo;
      const data = canliMasalar[String(masaNo)];

      document.getElementById('panel-table-title').innerText = `Masa ${masaNo} Adisyonu`;
      const listEl = document.getElementById('panel-orders-list');
      const footerEl = document.getElementById('panel-footer');

      if (!data || !data.urunler || data.urunler.length === 0) {
        document.getElementById('panel-order-time').innerText = "Henüz sipariş yok";
        listEl.innerHTML = `<div class="empty-state">Bu masa şu anda boş.</div>`;
        footerEl.style.display = "none";
        return;
      }

      document.getElementById('panel-order-time').innerText = `Son Sipariş: ${data.saat || '-'}`;
      footerEl.style.display = "block";
      document.getElementById('panel-total-price').innerText = `${data.toplamTutar} ₺`;

      listEl.innerHTML = "";
      data.urunler.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = "order-item-row";
        row.innerHTML = `
          <div class="item-left">
            <span class="item-name">${item.ad}</span>
            <span class="item-unit-info">${item.adet} adet × ${item.birimFiyat} ₺</span>
          </div>
          <div class="item-actions">
            <span class="item-price">${item.tutar} ₺</span>
            <button class="btn-qty-minus" onclick="adetAzalt(${masaNo}, ${index})">−</button>
            <button class="btn-item-delete" onclick="urunuSil(${masaNo}, ${index})">✕</button>
          </div>
        `;
        listEl.appendChild(row);
      });
    }

    async function adetAzalt(masaNo, index) {
      const data = canliMasalar[String(masaNo)];
      if (!data || !data.urunler[index]) return;

      const urun = data.urunler[index];
      if (urun.adet > 1) {
        urun.adet -= 1;
        urun.tutar = urun.adet * urun.birimFiyat;
      } else {
        data.urunler.splice(index, 1);
      }

      data.toplamTutar = data.urunler.reduce((acc, curr) => acc + curr.tutar, 0);

      if (data.urunler.length === 0) {
        delete canliMasalar[String(masaNo)];
        await fetch(`${FIREBASE_URL}/masalar/${masaNo}.json`, { method: 'DELETE' });
      } else {
        await fetch(`${FIREBASE_URL}/masalar/${masaNo}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      }
      masalariCiz();
    }

    async function urunuSil(masaNo, index) {
      const data = canliMasalar[String(masaNo)];
      if (!data || !data.urunler[index]) return;

      if (confirm(`"${data.urunler[index].ad}" adisyondan çıkarılsın mı?`)) {
        data.urunler.splice(index, 1);
        data.toplamTutar = data.urunler.reduce((acc, curr) => acc + curr.tutar, 0);

        if (data.urunler.length === 0) {
          delete canliMasalar[String(masaNo)];
          await fetch(`${FIREBASE_URL}/masalar/${masaNo}.json`, { method: 'DELETE' });
        } else {
          await fetch(`${FIREBASE_URL}/masalar/${masaNo}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
        }
        masalariCiz();
      }
    }

    async function masayiBosalt() {
      if (!seciliMasa) return;
      if (confirm(`Masa ${seciliMasa} hesabını kapatıp masayı boşaltmak istediğinize emin misiniz?`)) {
        delete canliMasalar[String(seciliMasa)];
        await fetch(`${FIREBASE_URL}/masalar/${seciliMasa}.json`, { method: 'DELETE' });
        masalariCiz();
        masaDetayiGoster(seciliMasa);
      }
    }

    function garsonUyarisiGoster(masaNo) {
      calGarsonSesi();
      const el = document.getElementById('garson-alert');
      document.getElementById('garson-alert-text').innerText = `Masa ${masaNo} garson çağırıyor! 🔔`;
      el.style.display = 'flex';
      setTimeout(() => { el.style.display = 'none'; }, 5500);
    }

    masalariCiz();
    setInterval(buluttanVeriCek, 2000);
    buluttanVeriCek();
  </script>
</body>
</html>
