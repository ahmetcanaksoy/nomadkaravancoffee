<!DOCTYPE html>
<html lang="tr">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nomâd Karavan | 50 Masa QR Kodları</title>
  <link rel="icon" type="image/jpeg" href="nomadlogo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: #0f1c15;
      color: #f8fafc;
      padding: 24px 16px;
    }

    #pin-lock-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at center, #253336 0%, #121c17 65%, #16181c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .pin-card {
      background: linear-gradient(145deg, #323942 0%, #192d23 100%);
      border: 1.5px solid rgba(245, 158, 11, 0.45);
      border-radius: 26px;
      padding: 30px 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    }

    .pin-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, #ea580c 0%, #1b4d36 100%);
      border: 1.5px solid #f59e0b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }

    .pin-card h2 {
      font-size: 1.15rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .pin-card p {
      font-size: 0.76rem;
      color: #cbd5e1;
      margin-bottom: 18px;
    }

    .pin-input {
      width: 100%;
      background: rgba(20, 26, 29, 0.95);
      border: 1.5px solid rgba(203, 213, 225, 0.25);
      border-radius: 14px;
      padding: 14px;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 6px;
      text-align: center;
      color: #f59e0b;
      outline: none;
      margin-bottom: 12px;
    }

    .pin-input:focus {
      border-color: #f59e0b;
    }

    .btn-pin-submit {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      color: #0f172a;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 900;
      cursor: pointer;
    }

    .pin-error {
      color: #f87171;
      font-size: 0.78rem;
      font-weight: 800;
      margin-top: 10px;
      display: none;
    }

    #protected-qr-app {
      display: none;
    }

    .top-bar {
      max-width: 960px;
      margin: 0 auto 24px;
      background: rgba(22, 42, 32, 0.9);
      border: 1.5px solid rgba(234, 88, 12, 0.35);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .top-bar h1 {
      font-size: 1.15rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .top-bar p {
      font-size: 0.78rem;
      color: #f59e0b;
      font-weight: 700;
      margin-top: 4px;
    }

    .top-bar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-print {
      background: #ea580c;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-lock {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }

    .qr-grid {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 16px;
    }

    .qr-card {
      background: #ffffff;
      color: #0f1c15;
      border-radius: 22px;
      padding: 20px 16px;
      text-align: center;
      border: 3px solid #ea580c;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      break-inside: avoid;
    }

    .qr-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 6px;
      display: block;
    }

    .qr-brand {
      font-size: 0.85rem;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .qr-sub-brand {
      font-size: 0.62rem;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .qr-card img.qr-code-img {
      width: 160px;
      height: 160px;
      margin: 0 auto 12px;
      display: block;
    }

    .qr-masa-badge {
      background: #0f1c15;
      color: #f59e0b;
      font-size: 1.15rem;
      font-weight: 900;
      padding: 8px 18px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 6px;
    }

    .qr-hint {
      font-size: 0.7rem;
      color: #475569;
      font-weight: 700;
    }

    @media print {
      body { background: #ffffff; padding: 0; }
      #pin-lock-screen, .top-bar { display: none !important; }
      .qr-card { box-shadow: none; border: 2px solid #000; }
    }
  </style>
</head>
<body>

  <div id="pin-lock-screen">
    <form class="pin-card" onsubmit="qrSifreKontrol(event)">
      <div class="pin-icon">🔒</div>
      <h2>NOMÂD KARAVAN QR</h2>
      <p>Masa QR kodlarını görüntülemek için kasa şifresini giriniz</p>
      <input type="password" id="qr-pin-input" class="pin-input" inputmode="numeric" maxlength="8" placeholder="••••" required autofocus>
      <button type="submit" class="btn-pin-submit">QR Kodları Aç →</button>
      <div class="pin-error" id="qr-pin-error">Hatalı şifre, tekrar deneyin.</div>
    </form>
  </div>

  <div id="protected-qr-app">
    <div class="top-bar">
      <div>
        <h1>NOMÂD KARAVAN COFFEE • 50 MASA QR KODLARI</h1>
        <p id="base-url-text">Site adresi algılanıyor...</p>
      </div>
      <div class="top-bar-actions">
        <button class="btn-print" onclick="window.print()">🖨️ Tümünü Yazdır / PDF Kaydet</button>
        <button class="btn-lock" onclick="qrKilitle()">🔒 Kilitle</button>
      </div>
    </div>

    <div class="qr-grid" id="qr-container"></div>
  </div>

  <script>
    const QR_SIFRESI = "2905";
    let qrOlusturuldu = false;

    function qrKodlariniOlustur() {
      if (qrOlusturuldu) return;
      qrOlusturuldu = true;

      const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      document.getElementById('base-url-text').innerText = "Aktif Site Adresi: " + decodeURIComponent(baseUrl);

      const container = document.getElementById('qr-container');
      container.innerHTML = "";

      for (let i = 1; i <= 50; i++) {
        const masaLink = `${baseUrl}?masa=${i}`;
        const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&margin=6&data=${encodeURIComponent(masaLink)}`;

        const card = document.createElement('div');
        card.className = 'qr-card';
        card.innerHTML = `
          <img class="qr-logo" src="nomadlogo.jpg" alt="Nomâd Karavan Coffee">
          <div class="qr-brand">NOMÂD</div>
          <div class="qr-sub-brand">KARAVAN COFFEE</div>
          <img class="qr-code-img" src="${qrApi}" alt="Masa ${i} QR" loading="lazy">
          <div class="qr-masa-badge">MASA ${i}</div>
          <div class="qr-hint">Sipariş & Garson için okutun</div>
        `;
        container.appendChild(card);
      }
    }

    function qrSifreKontrol(e) {
      e.preventDefault();
      const girilen = document.getElementById('qr-pin-input').value.trim();
      const hataEl = document.getElementById('qr-pin-error');

      if (girilen === QR_SIFRESI) {
        sessionStorage.setItem('nomad_kasa_yetki', '1');
        hataEl.style.display = 'none';
        document.getElementById('pin-lock-screen').style.display = 'none';
        document.getElementById('protected-qr-app').style.display = 'block';
        qrKodlariniOlustur();
      } else {
        hataEl.style.display = 'block';
        document.getElementById('qr-pin-input').value = '';
      }
    }

    function qrKilitle() {
      sessionStorage.removeItem('nomad_kasa_yetki');
      document.getElementById('qr-pin-input').value = '';
      document.getElementById('protected-qr-app').style.display = 'none';
      document.getElementById('pin-lock-screen').style.display = 'flex';
    }

    if (sessionStorage.getItem('nomad_kasa_yetki') === '1') {
      document.getElementById('pin-lock-screen').style.display = 'none';
      document.getElementById('protected-qr-app').style.display = 'block';
      qrKodlariniOlustur();
    }
  </script>
</body>
</html>
